[project]
name = "SBI-for-Diffusion-Models"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26,<2",
    "pandas>=2.3.3",
    "pytest>=9.0.2",
    "sbi>=0.25.0",
    "torch==2.10.0",
]

[tool.uv]
override-dependencies = [
    "torch<2.11",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbi_for_diffusion_models"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]
